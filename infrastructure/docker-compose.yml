version: "3.9"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ed_forum
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.backend
    env_file:
      - ../backend/.env.example
    depends_on:
      - postgres
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "3000:3000"
volumes:
  pgdata:
