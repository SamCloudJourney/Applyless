[project]
name = "edforum-backend"
version = "0.1.0"
description = "FastAPI backend for the modern East Dulwich Forum"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "psycopg[binary]>=3.1.18",
    "pydantic-settings>=2.2.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "email-validator>=2.1.1",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "redis>=5.0.1",
    "httpx>=0.27.0",
    "orjson>=3.9.15",
    "uvloop>=0.19.0",
    "structlog>=24.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-python-jose",
    "types-passlib"
]

[tool.uvicorn]
factory = false
app = "app.main:app"
reload = true
host = "0.0.0.0"
port = 8000

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

